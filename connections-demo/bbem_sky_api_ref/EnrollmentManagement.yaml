components:
  schemas:
    Application:
      type: object
      properties:
        id:
          type: integer
          description: The ID of the application
          format: int32
          nullable: true
        form:
          $ref: '#/components/schemas/TableValueBase'
        date_submitted:
          type: string
          description: The date the application was submitted
          format: date-time
          nullable: true
        date_processed:
          type: string
          description: The date the application was processed
          format: date-time
          nullable: true
      additionalProperties: false
      description: An object for application information
    CandidateChecklist:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ChecklistTypeRead'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/CandidateChecklistStepRead'
          description: An array of the candidate's checklist steps
          nullable: true
      additionalProperties: false
      description: 'An object with information about the candidate''s instance of a candidate checklist, include checklist type and steps'
    CandidateChecklistBase:
      type: object
      properties:
        id:
          type: integer
          description: The checklist id for the candidate that year
          format: int32
          nullable: true
        name:
          type: string
          description: The checklist name
          nullable: true
      additionalProperties: false
      description: An object with checklist information
    CandidateChecklistStepEdit:
      required:
        - step_type_id
      type: object
      properties:
        step_type_id:
          type: integer
          description: The ID of the checklist type's step
          format: int32
        status:
          type: string
          description: 'The candidate�s status for the checklist step. Allowed values: Awaiting, Requested, Waived, Completed'
          nullable: true
        date_due:
          type: string
          description: The due date of the step
          nullable: true
        date_completed:
          type: string
          description: The date the step was completed
          nullable: true
        comment:
          type: string
          description: 'The comment for the step. Max length: 4000 characters.'
          nullable: true
      additionalProperties: false
      description: An object with a candidate's checklist step values
    CandidateChecklistStepRead:
      type: object
      properties:
        id:
          type: integer
          description: The ID of the checklist step for the candidate
          format: int32
          nullable: true
