              example: 0
  '/v1/studentchecklists/{student_id}':
    get:
      tags:
        - StudentChecklists
      summary: Student checklist list - single student (Get)
      description: "Returns a student's checklists and their steps for a specified year.\n\r\nRequires the following role in the Education Management system:\r\n<ul><li>Admissions Manager</li><li>Admissions Staff</li></ul>"
      operationId: V1StudentchecklistsByStudent_idGet
      parameters:
        - name: student_id
          in: path
          description: The ID of the student
          required: true
          schema:
            type: integer
            format: int32
        - name: school_year
          in: query
          description: The ID or label of the school year. Defaults to current admissions year.
          schema:
            type: string
        - name: student_checklist_type_id
          in: query
          description: The ID of student checklist type
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentChecklistsResponse'
              example:
                - checklist:
                    id: 1
                    type:
                      id: 1
                      name: Re-enrollment
                      is_inactive: false
                      is_archived: false
                      school_year:
                        id: 1
                        description: 2024 - 2025
                  steps:
                    - id: 1
                      type:
                        id: 1
                        name: Update medical history
                        type: Medical form
                        description: Provide necessary medical info
                        due_date: '2022-03-31T12:00:00.0000000+00:00'
                        is_inactive: false
                        is_required: false
                        link: www.example.com
                        link_text: Medical form
                        file: filename.doc
                      status: Awaiting
                      date_completed: '2022-03-31T12:00:00.0000000+00:00'
                      file: med_history.pdf
                      comment: Comment
  '/v1/studentchecklists/{student_id}/{student_checklist_id}/steps/{step_id}':
    patch:
      tags:
        - StudentChecklists
      summary: Student checklist step (Edit)
      description: "Updates a step on a student checklist.\n\r\nRequires the following role in the Education Management system:\r\n<ul><li>Admissions Manager</li><li>Admissions Staff</li></ul>"
      operationId: V1StudentchecklistsByStudent_idByStudent_checklist_idStepsByStep_idPatch
      parameters:
        - name: student_id
          in: path
          description: The ID of the student
          required: true
          schema:
            type: integer
            format: int32
        - name: step_id
          in: path
          description: The ID of the student�s instance of the checklist step
          required: true
          schema:
            type: integer
            format: int32
        - name: student_checklist_id
          in: path
          description: The ID of the student's instance of the student checklist
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        description: The step model to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentChecklistStepUpdate'
            example:
              status: Submitted
              date_completed: '2025-08-31T12:00:00.0000000+00:00'
              comment: A stependous comment
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: integer
                format: int32
              example: 0
  /v1/types/candidatestatuses:
    get:
      tags:
        - Types
      summary: Candidate status type list (Get)
      description: "Returns a collection of admission statuses.\n\r\nRequires one of the following roles in the Education Management system:\r\n<ul><li>Admissions Manager</li><li>Admissions Staff</li><li>Platform Manager</li><li>SKY API Data Sync</li></ul>"
