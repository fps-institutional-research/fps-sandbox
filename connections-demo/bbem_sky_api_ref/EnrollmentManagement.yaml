          type: string
          description: The due date of the step
          format: date-time
          nullable: true
        date_completed:
          type: string
          description: The date the step was completed
          format: date-time
          nullable: true
        comment:
          type: string
          description: The comment for this checklist step
          nullable: true
      additionalProperties: false
      description: 'An object with information about the candidate''s instance of a checklist step, including ID, type, status, date due and completed and the comment.'
