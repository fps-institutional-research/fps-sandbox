      description: "Creates a candidate record for the user for a specified school year.\n\r\nRequires the following role in the Education Management system:\r\n<ul><li>Admissions Manager</li><li>Admissions Staff</li><li>Platform Manager</li><li>SKY API Data Sync</li></ul>"
