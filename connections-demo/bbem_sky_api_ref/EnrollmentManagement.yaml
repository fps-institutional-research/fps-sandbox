          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateStatusReadCollection'
              example:
                count: 1
                value:
                  - id: 1
                    description: Applied
                    next_status:
                      id: 2
                      description: Under Review
  /v1/types/checkliststatuses:
