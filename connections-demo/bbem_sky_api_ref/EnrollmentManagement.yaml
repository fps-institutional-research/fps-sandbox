  '/v1/types/checklistTypes/{checklist_type_id}':
    get:
      tags:
        - Types
      summary: Candidate checklist type (Get)
      description: "Returns a checklist and the steps defined for the checklist.\n\r\nRequires the following role in the Education Management system:\r\n<ul><li>Admissions Manager</li><li>Admissions Staff</li></ul>"
      operationId: V1TypesChecklistTypesByChecklist_type_idGet
      parameters:
        - name: checklist_type_id
          in: path
          description: The ID of the checklist type
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistTypeWithStepsRead'
              example:
                id: 1
                name: Standard Candidate Checklist
                is_inactive: false
                is_archived: false
                steps:
                  - id: 1
                    name: Math recommendation
                    type: Recommendation
                    milestone: Application
