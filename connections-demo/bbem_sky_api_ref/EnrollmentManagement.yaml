      operationId: V1TestsByCandidate_idPost
      parameters:
        - name: candidate_id
          in: path
          description: The user ID of the candidate
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        description: The request containing the test details.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateTestAdd'
            example:
              type: ISEE
              test_date: '2024-06-20T12:00:00.0000000+00:00'
