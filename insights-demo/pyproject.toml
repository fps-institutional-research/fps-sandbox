[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fps-insights"
version = "0.1.0"
description = "Blackbaud SKY API SDK for FPS Insights"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "python-dotenv",
    "pyotp",
    "selenium"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sky_api_custom_auth*"]
